<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meme Dailies</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="favicon.png">
<link rel="manifest" href="manifest.json">
<style>
/* Full-bleed meme on black, floating controls; library is an edge-to-edge grid. */
:root{
  --bg:#000; --ink:#fff; --ink-2:#A3A3A3; --ink-3:#555; --glass:rgba(255,255,255,.14); --line:rgba(255,255,255,.22);
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  /* one side gutter and one top inset for every screen */
  --gl:max(20px,env(safe-area-inset-left,0px)); --gr:max(20px,env(safe-area-inset-right,0px));
  --top:calc(env(safe-area-inset-top,0px) + 10px); --bot:calc(env(safe-area-inset-bottom,0px) + 20px);
  /* type scale */
  --t-cap:13px; --t-body:15px; --t-btn:16px; --t-h3:20px; --t-h2:30px; --t-h1:clamp(36px,10.5vw,46px);
  --btn-h:54px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font);overscroll-behavior:none;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#reel{z-index:1}#review{z-index:4}#lib{z-index:5}#viewer{z-index:10}

/* reel */
.stage{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
.meme{position:absolute;inset:0;display:grid;place-items:center;will-change:transform;background:var(--bg)}
.meme img{max-width:100%;max-height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-touch-callout:none}
.meme.next{z-index:0}.meme.cur{z-index:1}
.loading{font-size:var(--t-cap);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.top{position:absolute;z-index:3;left:0;right:0;top:0;padding:var(--top) var(--gr) 26px var(--gl);
  background:linear-gradient(rgba(0,0,0,.75),transparent);display:flex;flex-direction:column;gap:12px;pointer-events:none}
.top>*{pointer-events:auto}
.prog{height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.prog i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .3s}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.left{display:flex;align-items:center;gap:10px}
.lbl{font-weight:800;font-size:var(--t-cap);letter-spacing:.09em;text-transform:uppercase}
.count{font-size:var(--t-cap);color:#ccc;font-variant-numeric:tabular-nums}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);position:relative;flex:none}
.ibtn svg{width:19px;height:19px}
.ibtn:disabled{opacity:0;pointer-events:none}
#undo:disabled{display:none}
.badge{position:absolute;top:-3px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:#fff;color:#000;font-weight:800;font-size:11px;line-height:19px;text-align:center}
.badge:empty{display:none}
.controls{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:60px max(36px,env(safe-area-inset-right,0px)) var(--bot) max(36px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.85) 60%);display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.controls button{pointer-events:auto}
.cbtn{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .12s}
.cbtn:active{transform:scale(.9)}
.cbtn svg{width:26px;height:26px}
.cbtn.heart{width:54px;height:54px;background:transparent;border:2px solid #fff}
.cbtn.heart svg{width:23px;height:23px}
.cbtn:disabled{opacity:.25}
.pop{position:absolute;z-index:4;left:50%;top:50%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:rgba(0,0,0,.55);display:grid;place-items:center;opacity:0;pointer-events:none}
.pop svg{width:52px;height:52px}
.pop.on{animation:pop .6s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.05)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
.done{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px;padding:0 max(32px,env(safe-area-inset-left,0px))}
.done h2{margin:0;font-weight:800;font-size:40px;letter-spacing:-.035em;line-height:1}
.done p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.45;max-width:28ch;justify-self:center}
.done .ttl{font-size:clamp(34px,11vw,48px);text-wrap:balance}
.done .stats{display:flex;justify-content:center;gap:10px;margin-top:6px}
.done .stats span{border:2px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.done .next{font-size:13px;color:var(--ink-3);margin-top:4px}
.done .acts{display:flex;flex-direction:column;gap:10px;margin-top:14px;width:min(320px,80vw);justify-self:center}
.abtn{border:2px solid var(--line);border-radius:99px;padding:15px;font-weight:700;font-size:16px}
.abtn.main{background:#fff;color:#000;border-color:#fff}
/* review: swipe back through today's memes and change any verdict */
#review .rv{position:absolute;inset:0;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
#review .track{position:absolute;inset:0;display:flex;will-change:transform}
#review .slide{flex:0 0 100%;display:grid;place-items:center;height:100%}
#review .slide img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default}
#review .dots{display:flex;gap:3px;height:3px}
#review .dots i{flex:1;border-radius:3px;background:rgba(255,255,255,.22)}
#review .dots i.no{background:rgba(255,90,80,.55)}#review .dots i.yes{background:rgba(255,255,255,.55)}#review .dots i.save{background:#fff}
#review .dots i.cur{outline:1.5px solid #fff;outline-offset:1px;background:#fff}
#review .verd{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:50px max(36px,env(safe-area-inset-right,0px)) var(--bot) max(36px,env(safe-area-inset-left,0px));
  background:linear-gradient(transparent,rgba(0,0,0,.85) 55%);display:flex;flex-direction:column;align-items:center;gap:10px}
#review .vrow{display:flex;justify-content:space-between;align-items:center;width:100%}
#review .vb{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:.55;transition:transform .12s,opacity .12s}
#review .vb svg{width:24px;height:24px}
#review .vb.on{opacity:1;background:#fff;color:#000;transform:scale(1.06)}
#review .vhint{font-size:var(--t-cap);white-space:nowrap;color:var(--ink-2)}
#review .nav{position:absolute;z-index:2;top:20%;bottom:28%;width:22%;}
#review .nav.l{left:0}#review .nav.r{right:0}

/* library */
.lhead{padding:var(--top) var(--gr) 14px var(--gl);display:flex;align-items:center;gap:12px;background:var(--bg)}
.lhead h1{margin:0;font-weight:800;font-size:var(--t-h2);letter-spacing:-.03em;flex:1;line-height:1}
.lhead h1 span{font-weight:300;color:var(--ink-2)}
.tbtn{font-size:var(--t-body);font-weight:500;color:#ddd;padding:8px 2px}
.lgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;align-content:start;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 96px)}
.th{aspect-ratio:1;max-width:100%;background:#111;position:relative;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .ck{position:absolute;right:7px;bottom:7px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);display:none;place-items:center}
.selecting .th .ck{display:grid}
.th.sel .ck{background:#fff;color:#000}
.th.sel img{opacity:.6}
.th .ck svg{width:14px;height:14px;opacity:0}.th.sel .ck svg{opacity:1}
.lempty{grid-column:1/-1;padding:32px var(--gr) 32px var(--gl);color:var(--ink-2);font-size:var(--t-body);line-height:1.5;max-width:34ch}
.lempty b{display:block;color:#fff;font-size:var(--t-h3);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.pill{position:fixed;z-index:6;left:var(--gl);right:var(--gr);bottom:var(--bot);
  max-width:480px;margin:0 auto;background:#fff;color:#000;border-radius:99px;height:var(--btn-h);text-align:center;font-weight:700;font-size:var(--t-btn)}
.pill:disabled{opacity:.35}

/* viewer */
.vimg{flex:1;min-height:0;position:relative;margin-top:calc(env(safe-area-inset-top,0px) + 60px)}
.vimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vclose{position:absolute;top:var(--top);right:var(--gr)}
.vbar{padding:16px var(--gr) var(--bot) var(--gl);display:flex;flex-direction:column;gap:10px;max-width:520px;width:100%;margin:0 auto}
.vbar .row{display:flex;gap:10px}
.vbar .main{flex:1;background:#fff;color:#000;border-radius:99px;height:var(--btn-h);font-weight:700;font-size:var(--t-btn)}
.vbar .sec{border:2px solid var(--line);border-radius:99px;height:var(--btn-h);padding:0 22px;font-weight:700;font-size:var(--t-btn)}
.hint{font-size:var(--t-cap);color:var(--ink-2);text-align:center;margin:0}
.toast{position:fixed;z-index:20;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);background:#fff;color:#000;font-size:var(--t-body);font-weight:600;
  padding:10px 16px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.pop.on{animation:none}}
/* top bar groups */
.rgt{display:flex;gap:8px}
/* morning hello: big dog, a different line and button each day */
#welcome{position:fixed;inset:0;z-index:40;background:#000;transition:opacity .35s,transform .35s}
#welcome.out{opacity:0;transform:scale(1.03);pointer-events:none}
#welcome .s,.end{position:absolute;inset:0;display:flex;flex-direction:column;gap:18px;max-width:560px;margin:0 auto;padding:var(--top) var(--gr) var(--bot) var(--gl)}
#welcome .hd,.end .hd{display:flex;justify-content:space-between;align-items:center;min-height:40px}
#welcome .hd b,.end .hd b{font-weight:800;font-size:var(--t-h3);letter-spacing:-.02em}
#welcome .hd span,.end .hd span{color:var(--ink-2);font-size:var(--t-body)}
#welcome .dog{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:24px;max-height:48vh;flex:none;animation:hin .6s cubic-bezier(.2,.8,.2,1) both}
#welcome .t,.end .t{display:flex;flex-direction:column;gap:10px;animation:hin .6s cubic-bezier(.2,.8,.2,1) both .08s}
#welcome .line,.end .line{margin:0;font-weight:800;font-size:var(--t-h1);letter-spacing:-.04em;line-height:1;text-wrap:balance}
#welcome .sub,.end .sub{margin:0;color:var(--ink-2);font-size:var(--t-btn);line-height:1.4;text-wrap:pretty}
#welcome .row,.end .row{margin-top:auto;display:flex;gap:12px}
#welcome .go,.end .go{flex:1;border-radius:99px;height:var(--btn-h);font-weight:700;font-size:var(--t-btn);background:#fff;color:#000}
#welcome .sq,.end .sq{width:var(--btn-h);height:var(--btn-h);flex:none;border-radius:99px;border:2px solid var(--line);display:grid;place-items:center}
#welcome .sq svg,.end .sq svg{width:22px;height:22px}
/* end of the day: message and counts centred, with room to breathe */
.end{z-index:5;background:var(--bg)}
.end .stats{display:flex;gap:8px;flex-wrap:wrap}
.end .chip{border:2px solid var(--line);border-radius:99px;padding:0 14px;height:36px;display:inline-flex;align-items:center;font-size:var(--t-body);font-weight:600;font-variant-numeric:tabular-nums}
.end .next{color:var(--ink-3);font-size:var(--t-cap)}
.end.c{text-align:center}.end.c .stats{justify-content:center}.end.c .t{align-items:center}
.end .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px;padding-bottom:24px}
.end.c .t{gap:18px}
.end.c .sub{max-width:30ch}
.end .next{margin-bottom:6px}
@keyframes hin{from{opacity:0;transform:translateY(3cqw)}}
</style>
</head>
<body>

<section class="screen" id="reel" aria-label="Memes">
  <div class="stage" id="stage"><div class="done"><p class="loading">Loading</p></div></div>
  <div class="pop" id="pop" aria-hidden="true"></div>
  <div class="top">
    <div class="prog"><i id="prog" style="width:0"></i></div>
    <div class="bar">
      <div class="left">
        <button class="ibtn" id="undo" aria-label="Undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
        <span class="lbl">Today</span><span class="count" id="count"></span>
      </div>
      <div class="rgt"><button class="ibtn" id="share" aria-label="Share this meme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
      <button class="ibtn" id="openLib" aria-label="Saved memes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span class="badge" id="badge"></span></button></div>
    </div>
  </div>
  <div class="controls">
    <button class="cbtn" id="bNo" aria-label="Dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <button class="cbtn heart" id="bSave" aria-label="Save to library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20.5s-8-4.9-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 6.1-8 11-8 11z"/></svg></button>
    <button class="cbtn" id="bYes" aria-label="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg></button>
  </div>
</section>

<section class="screen" id="review" aria-label="Today's memes" hidden>
  <div class="rv" id="rv"><div class="track" id="track"></div></div>
  <button class="nav l" id="rvPrev" aria-label="Previous meme"></button><button class="nav r" id="rvNext" aria-label="Next meme"></button>
  <div class="top">
    <div class="dots" id="dots"></div>
    <div class="bar">
      <div class="left"><button class="ibtn" id="rvClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <span class="lbl">Today</span><span class="count" id="rvCount"></span></div>
      <div class="rgt"><button class="ibtn" id="rvShare" aria-label="Share this meme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
      <button class="ibtn" id="rvLib" aria-label="Saved memes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button></div>
    </div>
  </div>
  <div class="verd">
    <div class="vrow">
      <button class="vb" data-v="-1" aria-label="Dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="vb" data-v="2" aria-label="Saved"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5s-8-4.9-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 6.1-8 11-8 11z"/></svg></button>
      <button class="vb" data-v="1" aria-label="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg></button>
    </div>
    <div class="vhint">Swipe to look back · tap to change your mind</div>
  </div>
</section>

<section class="screen" id="lib" aria-label="Saved" hidden>
  <div class="lhead">
    <button class="ibtn" id="closeLib" aria-label="Back to memes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg></button>
    <h1>Saved <span id="libCount"></span></h1>
    <button class="tbtn" id="selBtn">Select</button>
  </div>
  <div class="lgrid" id="grid"></div>
  <button class="pill" id="saveSel" hidden>Save to Photos</button>
</section>

<section class="screen" id="viewer" hidden aria-label="Meme">
  <button class="ibtn vclose" id="vClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="vimg"><img id="vImg" alt="Saved meme"></div>
  <div class="vbar">
    <div class="row"><button class="main" id="vSave">Share or save</button><button class="sec" id="vRemove">Remove</button></div>
    <p class="hint">Send it, or tap “Save Image” to put it in Photos.</p>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>
<div id="welcome" hidden></div>
<script src="hello/lines.js" charset="utf-8"></script>

<script>
// ---------- storage: everything lives on this phone ----------
const LS = "memeDailies.v2";   // bumped: every phone starts fresh with this version
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
store.swipes = store.swipes || {};            // id -> {v: 2 saved | 1 liked | -1 disliked, src, t}
store.saved = store.saved || {};              // id -> {file, w, h, t}  (kept after the meme leaves the repo)
store.less = store.less || {src:{}, tag:{}};   // "less like this": extra dislikes per source / kind
store.blocked = store.blocked || [];           // sources never to show again
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch {} };

// saved images are copied into IndexedDB so the library survives after old memes are pruned from the repo
const idb = new Promise(res => { try { const r = indexedDB.open("memeDailies2", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("img"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } });
async function idbGet(id){ const db=await idb; if(!db) return null; return new Promise(r=>{ const q=db.transaction("img").objectStore("img").get(id); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }
async function idbPut(id,blob){ const db=await idb; if(!db) return; db.transaction("img","readwrite").objectStore("img").put(blob,id); }
async function idbDel(id){ const db=await idb; if(!db) return; db.transaction("img","readwrite").objectStore("img").delete(id); }

// ---------- learning ----------
// Starting weights per source; each source's score is Beta(likes + prior, dislikes + 1), sampled fresh each time (15% wildcards).
const PRIOR = {me_irl:3,meirl:3,"2meirl4meirl":3,surrealmemes:3,ClassicalArtMemes:3,trippinthroughtime:2,comedyheaven:2,absurdmemes:2,TherapyMemes:2,ArtHistoryMemes:2};
const prior = s => PRIOR[s] || (String(s).startsWith("arena:") ? 2 : 1);
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function gamma(k){if(k<1)return gamma(k+1)*Math.pow(Math.random(),1/k);const d=k-1/3,c=1/Math.sqrt(9*d);for(;;){let x,v;do{x=randn();v=1+c*x}while(v<=0);v=v*v*v;const u=Math.random();if(u<1-.0331*x**4)return d*v;if(Math.log(u)<.5*x*x+d*(1-v+Math.log(v)))return d*v}}
const beta=(a,b)=>{const x=gamma(a),y=gamma(b);return x/(x+y)};

const $ = s => document.querySelector(s);
const S = {memes:new Map(), queue:[], undo:[], batch:"", batchTotal:0, selecting:false, sel:new Set()};
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._h); e._h=setTimeout(()=>e.classList.remove("on"),1800); }

const DAILY = 50;
// Two things are learned: which sources you like, and which kinds of meme (therapy jokes, screenshots of posts,
// surreal, animals…). Each is a Beta(likes + prior, dislikes + 1) that is sampled fresh every time; 15% wildcards.
const tagsOf = (id, sw) => (sw && sw.tags) || S.memes.get(id)?.tags || [];
function tasteCounts(){
  const src={}, tag={}, bump=(o,k,f,n)=>{ const x=o[k]||(o[k]={l:0,p:0}); x[f]+=n; };
  for(const [id,s] of Object.entries(store.swipes)){
    if(!s.v) continue;
    const f=s.v>0?"l":"p", n=s.v>=2?2:1;
    bump(src,s.src,f,n); tagsOf(id,s).forEach(t=>bump(tag,t,f,n));
  }
  for(const [k,n] of Object.entries(store.less.src)) bump(src,k,"p",n*4);
  for(const [k,n] of Object.entries(store.less.tag)) bump(tag,k,"p",n*4);
  return {src, tag};
}
function tasteScore(m, c){
  if(Math.random()<.15) return Math.random();
  const k=c.src[m.src]||{l:0,p:0}, a=beta(k.l+prior(m.src), k.p+1), tg=m.tags||[];
  if(!tg.length) return a;
  const b=tg.reduce((sum,t)=>{ const x=c.tag[t]||{l:0,p:0}; return sum+beta(x.l+1,x.p+1); },0)/tg.length;
  return .5*a+.5*b;
}
const allowed = m => m && !store.blocked.includes(m.src);
// Once a day this phone picks its own 50 from today's pool, using what it has learned. Topped up from earlier days if the pool is short.
function pickToday(){
  const c=tasteCounts();
  const rankBy=list=>list.map(m=>[tasteScore(m,c),m]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  // keep today's picks, but drop any meme that's no longer on the site (removed or broken) and top back up to 50
  let keep = store.day===S.batch && Array.isArray(store.picks) ? store.picks.filter(id=>S.memes.has(id)) : [];
  if(keep.length>=DAILY){ if(keep.length!==store.picks.length){ store.picks=keep.slice(0,DAILY); persist(); } return; }
  const have=new Set(keep), fresh=m=>!have.has(m.id) && !store.swipes[m.id] && allowed(m);
  let add=rankBy([...S.memes.values()].filter(m=>m.batch===S.batch && fresh(m))).slice(0,DAILY-keep.length);
  if(keep.length+add.length<DAILY) add=add.concat(rankBy([...S.memes.values()].filter(m=>m.batch!==S.batch && fresh(m))).slice(0,DAILY-keep.length-add.length));
  store.day=S.batch; store.picks=keep.concat(add.map(m=>m.id)); persist();
}
// an image that fails to load is treated as gone: swap in another meme so the day still has 50
function dropBroken(id){
  if(!S.memes.has(id) || store.swipes[id]) return;
  S.memes.delete(id); pickToday(); rank(); render();
}
function rank(){
  const c=tasteCounts(), top=S.queue[0];
  const rest=(store.picks||[]).map(id=>S.memes.get(id)).filter(m=>m && allowed(m) && !store.swipes[m.id] && m!==top)
    .map(m=>[tasteScore(m,c),m]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  S.queue = top && !store.swipes[top.id] ? [top,...rest] : rest;
}

// ---------- reel ----------
const ICON = {
  no:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`,
  yes:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5 9.5 17.5 19.5 6.5"/></svg>`,
  save:`<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20.5s-8-4.9-8-11A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 2.9c0 6.1-8 11-8 11z"/></svg>`,
};
function memeEl(m, cls){
  const el=document.createElement("div"); el.className="meme "+cls; el.dataset.id=m.id;
  const i=new Image(); i.alt="Meme"; i.decoding="async"; i.draggable=false; i.onerror=()=>dropBroken(m.id); i.src=m.file; el.appendChild(i);
  return el;
}
function render(){
  const st=$("#stage"); st.innerHTML="";
  const q=S.queue;
  if(!q.length){
    st.innerHTML=finishHTML();
  } else {
    if(q[1]) st.appendChild(memeEl(q[1],"next"));
    const cur=memeEl(q[0],"cur"); st.appendChild(cur); gestures(cur); { const pid=q[0].id; setTimeout(()=>prepFile(pid),400); }
    q.slice(2,6).forEach(m=>{ const i=new Image(); i.src=m.file; });
  }
  ["#bNo","#bYes","#bSave"].forEach(s=>$(s).disabled=!q.length);
  document.querySelector(".controls").style.visibility = q.length ? "" : "hidden";
  $("#reel .top").style.visibility = q.length ? "" : "hidden";
  $("#undo").disabled=!S.undo.length;
  const total=(store.picks||[]).length||DAILY, left=q.length;
  $("#count").textContent = left ? `${total-left+1} / ${total}` : `${total} / ${total}`;
  $("#prog").style.width = Math.round((total-left)/total*100)+"%";
  $("#badge").textContent = Object.keys(store.saved).length || "";
}
function gestures(el){
  let sx=0,sy=0,dx=0,dy=0,on=false,t0=0,lastTap=0;
  const paint=()=>{ el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/22}deg)`; el.style.opacity=1-Math.min(.5,Math.hypot(dx,dy)/700); };
  el.addEventListener("pointerdown",e=>{ on=true; sx=e.clientX; sy=e.clientY; dx=dy=0; t0=performance.now(); el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove",e=>{ if(!on) return; dx=e.clientX-sx; dy=e.clientY-sy; paint(); });
  const end=()=>{ if(!on) return; on=false; const dt=performance.now()-t0, v=Math.abs(dx)/Math.max(dt,1);
    if(Math.hypot(dx,dy)<8 && dt<300){ const now=performance.now(); if(now-lastTap<320){ lastTap=0; return act("save"); } lastTap=now; }
    if(-dy>110 && -dy>Math.abs(dx)) return act("save");
    if(dx>100||(dx>40&&v>.6)) return act("yes");
    if(dx<-100||(dx<-40&&v>.6)) return act("no");
    el.style.transition="transform .25s, opacity .25s"; dx=dy=0; paint(); };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end);
}
function pop(kind){ const p=$("#pop"); p.innerHTML=ICON[kind]; p.classList.remove("on"); void p.offsetWidth; p.classList.add("on"); }
function act(kind){
  const m=S.queue[0]; if(!m) return;
  const el=$("#stage .meme.cur"), v= kind==="save"?2 : kind==="yes"?1 : -1;
  pop(kind);
  if(el){ const tx= kind==="yes"?innerWidth*1.2 : kind==="no"?-innerWidth*1.2 : 0, ty= kind==="save"?-innerHeight:0;
    el.style.transition="transform .3s ease-in, opacity .3s"; el.style.transform=`translate(${tx}px,${ty}px) rotate(${tx/40}deg)`; el.style.opacity=0; }
  store.swipes[m.id]={v, src:m.src, tags:m.tags||[], file:m.file, t:Date.now()};
  if(v===2){ store.saved[m.id]={file:m.file,w:m.w,h:m.h,t:Date.now()}; fetch(m.file).then(r=>r.blob()).then(b=>idbPut(m.id,b)).catch(()=>{}); }
  persist();
  S.undo.push(m.id); if(S.undo.length>30) S.undo.shift();
  S.queue.shift(); rank(); setTimeout(render, el?200:0);
}
function undo(){
  const id=S.undo.pop(); if(!id) return;
  delete store.swipes[id]; if(store.saved[id]){ delete store.saved[id]; idbDel(id); } persist();
  const m=S.memes.get(id); if(m) S.queue.unshift(m); render();
}
$("#bNo").onclick=()=>act("no"); $("#bYes").onclick=()=>act("yes"); $("#bSave").onclick=()=>act("save"); $("#undo").onclick=undo;
document.addEventListener("keydown",e=>{ if(!$("#lib").hidden||!$("#viewer").hidden||!$("#review").hidden) return; if(e.key==="ArrowLeft")act("no"); else if(e.key==="ArrowRight")act("yes"); else if(e.key==="ArrowUp")act("save"); });

// ---------- library ----------
const urls=new Map();
async function srcFor(id){
  if(urls.has(id)) return urls.get(id);
  const b=await idbGet(id); const u = b ? URL.createObjectURL(b) : (store.saved[id]?.file || "");
  urls.set(id,u); return u;
}
const savedIds=()=>Object.entries(store.saved).sort((a,b)=>b[1].t-a[1].t).map(([id])=>id);
function renderLib(){
  const g=$("#grid"), ids=savedIds(); g.innerHTML=""; $("#libCount").textContent=ids.length||"";
  g.classList.toggle("selecting",S.selecting); $("#selBtn").textContent=S.selecting?"Cancel":"Select"; $("#selBtn").hidden=!ids.length;
  if(!ids.length){ g.innerHTML=`<div class="lempty"><b>Nothing saved yet</b>Tap the heart, swipe up, or double-tap a meme to save it here.</div>`; updatePill(); return; }
  ids.forEach(id=>{ const b=document.createElement("button"); b.className="th"+(S.sel.has(id)?" sel":""); b.setAttribute("aria-label","Saved meme");
    b.innerHTML=`<span class="ck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg></span>`;
    srcFor(id).then(u=>{ if(u){ const i=new Image(); i.alt=""; i.loading="lazy"; i.src=u; b.prepend(i); } });
    b.onclick=()=>{ if(S.selecting){ S.sel.has(id)?S.sel.delete(id):S.sel.add(id); b.classList.toggle("sel"); updatePill(); } else openViewer(id); };
    g.appendChild(b); });
  updatePill();
}
function updatePill(){ const p=$("#saveSel"); p.hidden=!S.selecting; p.disabled=!S.sel.size; p.textContent=S.sel.size?`Save ${S.sel.size} to Photos`:"Select memes"; }
$("#selBtn").onclick=()=>{ S.selecting=!S.selecting; S.sel.clear(); renderLib(); };
$("#openLib").onclick=()=>{ $("#lib").hidden=false; renderLib(); };

// ---------- review today's memes ----------
const R={ids:[], i:0};
function seenToday(){ return (store.picks||[]).filter(id=>store.swipes[id] && (S.memes.has(id)||store.swipes[id].file||store.saved[id])).sort((a,b)=>store.swipes[a].t-store.swipes[b].t); }
function openReview(at){
  R.ids=seenToday(); if(!R.ids.length) return toast("Swipe a few first");
  R.i = at==null ? R.ids.length-1 : Math.max(0,Math.min(at,R.ids.length-1));
  $("#track").innerHTML=R.ids.map(()=>`<div class="slide"><img alt="Meme" draggable="false"></div>`).join("");
  $("#review").hidden=false; paintReview(false);
}
function paintReview(anim=true){
  const tr=$("#track"); tr.style.transition=anim?"transform .3s cubic-bezier(.2,.8,.2,1)":"none"; tr.style.transform=`translateX(${-R.i*100}%)`;
  $("#rvCount").textContent=`${R.i+1} / ${R.ids.length}`;
  // only keep the current meme and two on each side decoded, so 50 big images never pile up in memory
  [...$("#track").children].forEach((sl,k)=>{ const im=sl.firstChild, id=R.ids[k];
    if(Math.abs(k-R.i)<=2){ if(!im.getAttribute("src")){ const f=S.memes.get(id)?.file||store.swipes[id]?.file||store.saved[id]?.file; if(f) im.src=f; else srcFor(id).then(u=>{ if(u) im.src=u; }); } }
    else if(im.getAttribute("src")) im.removeAttribute("src"); });
  prepFile(R.ids[R.i]);
  const cur=store.swipes[R.ids[R.i]]?.v;
  document.querySelectorAll("#review .vb").forEach(b=>b.classList.toggle("on", +b.dataset.v===cur));
  $("#dots").innerHTML=R.ids.map((id,k)=>{ const v=store.swipes[id].v; return `<i class="${v>=2?"save":v===1?"yes":"no"}${k===R.i?" cur":""}"></i>`; }).join("");
}
function rvGo(d){ const n=R.i+d; if(n<0||n>=R.ids.length) return; R.i=n; paintReview(); }
$("#rvPrev").onclick=()=>rvGo(-1); $("#rvNext").onclick=()=>rvGo(1);
$("#rvClose").onclick=()=>{ $("#review").hidden=true; render(); };
$("#rvLib").onclick=()=>{ $("#lib").hidden=false; renderLib(); };
document.querySelectorAll("#review .vb").forEach(b=>b.onclick=()=>{
  const id=R.ids[R.i], m=S.memes.get(id), sw=store.swipes[id], v=+b.dataset.v; if(!sw||sw.v===v) return;
  const file=m?.file||sw?.file;
  if(v===2){ if(!file) return; store.saved[id]={file,w:m?.w,h:m?.h,t:Date.now()}; fetch(file).then(r=>r.blob()).then(bl=>idbPut(id,bl)).catch(()=>{}); toast("Saved to library"); }
  else if(sw.v>=2){ delete store.saved[id]; idbDel(id); toast(v===1?"Moved to liked":"Removed from saved"); }
  sw.v=v; persist(); paintReview(false);
});
(()=>{ // horizontal swipe between memes
  const el=$("#review"); let x0=0,y0=0,dx=0,on=false,horiz=null;
  el.addEventListener("touchstart",e=>{ if(e.target.closest(".verd,.top")) return; const t=e.touches[0]; x0=t.clientX; y0=t.clientY; dx=0; on=true; horiz=null; $("#track").style.transition="none"; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(!on) return; const t=e.touches[0]; dx=t.clientX-x0; const dy=t.clientY-y0;
    if(horiz===null && Math.hypot(dx,dy)>8) horiz=Math.abs(dx)>Math.abs(dy);
    if(horiz){ const edge=(R.i===0&&dx>0)||(R.i===R.ids.length-1&&dx<0); $("#track").style.transform=`translateX(calc(${-R.i*100}% + ${edge?dx/3:dx}px))`; } },{passive:true});
  el.addEventListener("touchend",()=>{ if(!on) return; on=false; if(horiz&&Math.abs(dx)>60) rvGo(dx<0?1:-1); else paintReview(); });
})();
document.addEventListener("keydown",e=>{ if($("#review").hidden||!$("#viewer").hidden||!$("#lib").hidden) return; if(e.key==="ArrowLeft")rvGo(-1); else if(e.key==="ArrowRight")rvGo(1); else if(e.key==="Escape")$("#rvClose").click(); });
$("#stage").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(!b) return; if(b.dataset.go==="review") openReview(0); else { $("#lib").hidden=false; renderLib(); } });
// tapping the counter during the day also opens the look-back
$("#count").style.cursor="pointer"; $("#count").addEventListener("click",()=>openReview());
$("#closeLib").onclick=()=>{ $("#lib").hidden=true; S.selecting=false; S.sel.clear(); };

// ---------- save to the phone: iOS share sheet -> "Save Image" puts it in Photos ----------
// Always hand iOS a plain JPEG image file, never a link, so the share sheet offers "Save Image" and sends a real picture.
const fileCache=new Map();
const prepFile = id => { if(id && !fileCache.has(id)) fileCache.set(id, makeFile(id).catch(()=>{ fileCache.delete(id); return null; })); return fileCache.get(id); };
async function makeFile(id){
  let b=await idbGet(id);
  const src=store.saved[id]?.file || S.memes.get(id)?.file;
  if(!b){ if(!src) return null; b=await (await fetch(src)).blob(); }
  if(b.type!=="image/jpeg"){
    const bmp=await createImageBitmap(b), c=document.createElement("canvas"); c.width=bmp.width; c.height=bmp.height;
    c.getContext("2d").drawImage(bmp,0,0); b=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));
  }
  return new File([b], `meme-${String(id).replace(/[^a-z0-9-]/gi,"")}.jpg`, {type:"image/jpeg"});
}
async function fileFor(id){ return prepFile(id); }
async function saveToPhone(ids){
  const files=(await Promise.all(ids.map(fileFor))).filter(Boolean);
  if(!files.length) return toast("That meme isn't available any more");
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files}); }catch(e){ if(e.name==="NotAllowedError") toast("Ready, tap share again"); else if(e.name!=="AbortError") toast("Press and hold the meme to save it"); }
    return;
  }
  for(const f of files){ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); }
  toast(files.length>1?`Downloaded ${files.length}`:"Downloaded");
}
$("#vSave").onclick=()=>saveToPhone([vId]);
$("#saveSel").onclick=async()=>{ await saveToPhone([...S.sel]); S.selecting=false; S.sel.clear(); renderLib(); };

let vId=null, vConfirm=false;
function openViewer(id){
  vId=id; vConfirm=false; prepFile(id); $("#vRemove").textContent="Remove"; $("#vImg").removeAttribute("src");
  srcFor(id).then(u=>{ if(vId===id) $("#vImg").src=u; });
  $("#viewer").hidden=false;
}
$("#vClose").onclick=()=>{ $("#viewer").hidden=true; vId=null; };
$("#vRemove").onclick=()=>{
  if(!vConfirm){ vConfirm=true; $("#vRemove").textContent="Tap to confirm"; return; }
  const id=vId; delete store.saved[id]; if(store.swipes[id]) store.swipes[id].v=1; persist(); idbDel(id);
  $("#viewer").hidden=true; vId=null; renderLib(); render();
};

// ---------- end of the day ----------
function finishHTML(){
  let saved=0, liked=0; const ids=store.picks||[];
  ids.forEach(id=>{ const v=store.swipes[id]?.v; if(v>=2) saved++; else if(v===1) liked++; });
  const now=new Date(), date=now.toLocaleDateString("en-GB",{weekday:"long"})+", "+now.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  const hd=`<div class="hd"><b>All done</b><span>${date}</span></div>`;
  const chips=`<div class="stats"><span class="chip">♥ ${saved} saved</span><span class="chip">✓ ${liked} liked</span></div>`;
  const grid=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>`;
  const row=`<div class="row"><button class="go" data-go="review">Look back at today's 50</button><button class="sq" data-go="lib" aria-label="Saved memes">${grid}</button></div>`;
  const next=`<div class="next">Next 50 arrive tomorrow morning</div>`;
  const t=`<div class="t"><p class="line">Thank you<br>for laughing.</p><p class="sub">Every meme was made by someone hoping a stranger would smile. Today, that stranger was you.</p></div>`;
  return `<div class="end c">${hd}<div class="mid">${t}${chips}</div>${next}${row}</div>`;
}

// ---------- share ----------
const shareMeme = id => saveToPhone([id]);
$("#share").onclick=()=>{ const m=S.queue[0]; if(m) shareMeme(m.id); };
$("#rvShare").onclick=()=>{ const id=R.ids[R.i]; if(id) shareMeme(id); };

// ---------- morning welcome ----------
function showWelcome(){
  const now=new Date(), today=now.toLocaleDateString("en-CA"), lines=window.HELLO_LINES;
  if(store.welcomeDay===today || !lines) return;
  const dayNo=Math.floor((now.getTime()-now.getTimezoneOffset()*60000)/86400000);
  const j=lines[dayNo % lines.length], el=$("#welcome");
  const day=now.toLocaleDateString("en-GB",{weekday:"long"}), dm=now.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
  el.innerHTML=`<div class="s"><div class="hd"><b>Good morning</b><span>${day}, ${dm}</span></div>
    <img class="dog" src="hello/dog.jpg" alt="The dog, mouth full of nuggets">
    <div class="t"><p class="line">${j.line}</p><p class="sub">${j.sub}</p></div>
    <div class="row"><button class="go">${j.btn}</button><button class="sq" aria-label="Saved memes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button></div></div>`;
  el.hidden=false;
  const close=()=>{ store.welcomeDay=today; persist(); el.classList.add("out"); setTimeout(()=>{ el.hidden=true; el.innerHTML=""; },380); };
  el.querySelector(".go").onclick=close;
  el.querySelector(".sq").onclick=()=>{ close(); $("#lib").hidden=false; renderLib(); };
}
showWelcome();

// ---------- boot ----------
(async()=>{
  try{
    const r=await fetch("memes.json",{cache:"no-cache"}); const data=await r.json();
    data.memes.forEach(m=>S.memes.set(m.id,m));
    S.batch=data.memes.reduce((a,m)=>m.batch>a?m.batch:a,"");
    pickToday(); rank(); render();
  }catch(e){
    $("#stage").innerHTML=`<div class="done"><h2>Hmm</h2><p>Couldn't load today's memes. Check your connection and reopen.</p></div>`;
  }
})();
</script>
</body>
</html>
